defaults:
  - /recipe/parquet_audio_text_direct@_here_
  - /tokenizer/apertus_wavtok@_here_
  - _self_

# Real-audio YODAS2 zh — extracted per-segment via scripts/extract_yodas2_to_parquet.py.
# Pairs with our synth `zh_yodas2_K50` / `_spk0668`.

name: mkwapniewska_zh_yodas2_real
language: zh

source:
  path: /capstor/scratch/cscs/mkwapniewska/yodas2_parquet/zh
  files: "train-*.parquet"

columns:
  audio: audio
  text: text
  duration: duration
  id: id
  language_column: language
  constant:
    dataset: yodas2_zh_real

outputs:
  shar_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/SHAR/real/zh_yodas2_real
  tokenized_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/tokenized/real
  name: zh_yodas2_real

conversion:
  num_workers: 32
  shard_size: 5000
  read_batch_size: 64

tokenization:
  min_duration: 2.0
  max_duration: 30.0
  max_batch_duration: 2000.0
  checkpoint_interval_batches: 2000
