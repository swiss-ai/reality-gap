defaults:
  - /recipe/wds_audio_only@_here_
  - /tokenizer/apertus_wavtok@_here_
  - _self_

# Real-audio YODAS2 zh — webdataset tar.zst format from HF cache.
# Pairs with our synth `zh_yodas2_K50` and `zh_yodas2_spk0668`.

name: mkwapniewska_zh_yodas2_real
language: zh

source:
  path: /capstor/store/cscs/swissai/infra01/audio-datasets/raw/hf___espnet___yodas2/data
  files: "zh000.tar.zst"

outputs:
  shar_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/SHAR/real/zh_yodas2_real
  tokenized_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/tokenized/real
  name: zh_yodas2_real

conversion:
  num_workers: 64
  shard_size: 5000
  read_batch_size: 256
  mp_start_method: fork

tokenization:
  min_duration: 2.0
  max_duration: 200.0
  max_batch_duration: 2000.0
  checkpoint_interval_batches: 2000
