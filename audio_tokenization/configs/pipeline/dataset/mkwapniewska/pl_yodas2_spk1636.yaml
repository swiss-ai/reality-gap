defaults:
  - /recipe/parquet_audio_text_direct@_here_
  - /tokenizer/apertus_wavtok@_here_
  - _self_

# Synthetic Polish ASR (VoxCPM2, MLS Polish speaker 1636 slow reference) —
# YODAS2 Polish subset, single-speaker K=1 variant.

name: mkwapniewska_pl_yodas2_spk1636
language: pl

source:
  path: /capstor/store/cscs/swissai/infra01/audio-datasets/synthesized/voxcpm2/pl_yodas2_spk1636/data
  files: "train-*.parquet"

columns:
  audio: audio
  text: text
  duration: duration
  id: id
  language_column: language
  constant:
    dataset: voxcpm2_pl_yodas2_spk1636

outputs:
  shar_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/SHAR/voxcpm2/pl_yodas2_spk1636
  tokenized_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/tokenized/voxcpm2/pl_yodas2_spk1636
  name: voxcpm2_pl_yodas2_spk1636

tokenization:
  min_duration: 1.0
  max_duration: 60.0

conversion:
  num_workers: 8
