defaults:
  - /recipe/parquet_audio_text_direct@_here_
  - /tokenizer/apertus_wavtok@_here_
  - _self_

# Real-audio Emilia ZH — extracted from WDS tars by scripts/extract_emilia_to_parquet.py
# (each tar contains flat <key>.mp3 + <key>.json pairs; sidecar JSON carries text + duration).
# Pairs with our synth zh_emilia_full_K50 / zh_emilia_full_spk0668 / zh_emilia_spk0668.

name: mkwapniewska_zh_emilia_real
language: zh

source:
  path: /capstor/scratch/cscs/mkwapniewska/emilia_zh_parquet
  files: "train-*.parquet"

columns:
  audio: audio
  text: text
  duration: duration
  id: id
  language_column: language
  constant:
    dataset: emilia_zh_real

outputs:
  shar_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/SHAR/real/zh_emilia_real
  tokenized_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/tokenized/real
  name: zh_emilia_real

conversion:
  num_workers: 32
  shard_size: 5000
  read_batch_size: 64

tokenization:
  min_duration: 2.0
  max_duration: 30.0
  max_batch_duration: 2000.0
  checkpoint_interval_batches: 2000
