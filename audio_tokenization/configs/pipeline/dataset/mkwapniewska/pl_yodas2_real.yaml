defaults:
  - /recipe/parquet_audio_text_direct@_here_
  - /tokenizer/apertus_wavtok@_here_
  - _self_

# Real-audio YODAS2 pl — extracted per-segment via scripts/extract_yodas2_to_parquet.py
# (slices video-level wavs from the nested tar.gz using start_cs/end_cs timestamps
# in the YODAS2 segment_id). Pairs with our synth `pl_yodas2_K50` / `_spk1636`.

name: mkwapniewska_pl_yodas2_real
language: pl

source:
  path: /capstor/scratch/cscs/mkwapniewska/yodas2_parquet/pl
  files: "train-*.parquet"

columns:
  audio: audio
  text: text
  duration: duration
  id: id
  language_column: language
  constant:
    dataset: yodas2_pl_real

outputs:
  shar_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/SHAR/real/pl_yodas2_real
  tokenized_dir: /capstor/store/cscs/swissai/infra01/audio-datasets/reality_gap/tokenized/real
  name: pl_yodas2_real

conversion:
  num_workers: 32
  shard_size: 5000
  read_batch_size: 64

tokenization:
  min_duration: 2.0
  max_duration: 30.0
  max_batch_duration: 2000.0
  checkpoint_interval_batches: 2000
